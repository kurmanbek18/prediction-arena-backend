<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>STYLE HUB — Бишкек</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#fff; --surface:#fff; --soft:#f4f5f7; --line:#e6e8ec; --text:#111318; --muted:#6a7280;
  --ink:#111318; --hot:#ff5a1f; --heart:#e5484d; --ok:#16a34a; --wa:#16a34a; --r:14px;
  --nav-h:62px; --top-h:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;height:var(--top-h);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-title{font-size:19px;font-weight:800;letter-spacing:.2px;line-height:1.1}
.brand-sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.top-actions{display:flex;gap:6px;align-items:center}
.pill{white-space:nowrap;border:1px solid var(--line);background:var(--soft);padding:7px 11px;border-radius:10px;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--text)}
.pill.wa{background:#ecfdf3;border-color:#bbf7d0;color:#15803d}

/* hero */
.hero{margin:12px 14px 0;padding:16px;border-radius:var(--r);background:var(--ink);color:#fff}
.hero h1{margin:0 0 6px;font-size:18px;line-height:1.25;font-weight:750}
.hero p{margin:0;font-size:13px;color:#c9ced8;line-height:1.5}

/* search + filters */
.search-wrap{position:sticky;top:var(--top-h);z-index:15;background:var(--bg);padding:10px 14px 6px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px 40px 12px 14px;font-size:16px;outline:none}
.search input:focus{border-color:var(--ink);background:#fff}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:34px;height:34px;font-size:16px;color:var(--muted)}
.hist{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.hist::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.hist button{flex:0 0 auto;border:0;background:var(--soft);padding:5px 10px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.filters{display:flex;gap:8px;padding:2px 14px 6px;align-items:center;flex-wrap:wrap}
.filters select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;max-width:46%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--ink);color:#fff}
.countline{display:flex;justify-content:space-between;align-items:center;padding:2px 14px 4px;font-size:12.5px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--text);font-weight:600;font-size:12.5px;text-decoration:underline;padding:4px}

/* strip with top picks */
.strip-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 2px}
.strip-head h2{margin:0;font-size:16px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-padding-left:14px;padding:8px 14px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.strip .card{flex:0 0 150px;scroll-snap-align:start}

/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:6px 14px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.img-box{position:relative;aspect-ratio:1/1;background:var(--soft) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 24 24' fill='none' stroke='%23c3c8d0' stroke-width='1.4'><path d='M3 16c3-1 4-5 7-5 2 0 3 2 5 2 3 0 4 1 6 3v2H3z'/></svg>") center/44px no-repeat;cursor:pointer}
.img-box img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.95);border:1px solid var(--line);padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.hot{background:var(--hot);border-color:var(--hot);color:#fff}
.heart{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center}
.heart svg{width:19px;height:19px;fill:none;stroke:var(--text);stroke-width:1.9}
.heart.on svg{fill:var(--heart);stroke:var(--heart)}
.card-body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.brand-tag{font-size:11.5px;color:var(--muted);font-weight:600}
.card-title{font-size:13.5px;font-weight:700;line-height:1.3;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.price{font-size:15px;font-weight:800}
.price s{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.price.req{font-size:13.5px;font-weight:700;color:var(--text)}
.hint{font-size:11.5px;color:var(--muted);margin-top:-2px}
.sizes-mini{font-size:11.5px;color:var(--muted)}
.btn-primary{margin-top:auto;width:100%;border:0;border-radius:11px;background:var(--ink);color:#fff;padding:11px;font-size:13.5px;font-weight:700}
.btn-primary.big{padding:14px;font-size:15px;border-radius:13px}
.btn-primary:disabled{opacity:.55}
.btn-secondary{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 14px;font-size:14px;font-weight:600}
.btn-wa{width:100%;border:0;border-radius:12px;background:var(--wa);color:#fff;padding:13px;font-size:14.5px;font-weight:700;text-decoration:none;display:flex;justify-content:center;align-items:center;gap:6px}
.sk{background:linear-gradient(90deg,#f1f2f4 0,#e9ebee 50%,#f1f2f4 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:var(--r);aspect-ratio:3/4}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.sheet,.backdrop{transition:none!important}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:34px 18px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.empty button{margin-top:14px}
.wake{grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--muted);padding:4px 0}
#sentinel{height:1px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.active{color:var(--ink)}
.nav .cnt{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--hot);color:#fff;font-size:10.5px;font-weight:800;display:none;place-items:center;padding:0 4px}
.nav .cnt.show{display:grid}

/* sheets */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(17,19,24,0);display:flex;align-items:flex-end;justify-content:center;transition:background .2s}
.backdrop.open{background:rgba(17,19,24,.45)}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:#fff;border-radius:18px 18px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(30px);opacity:0;transition:transform .22s ease,opacity .22s ease}
.backdrop.open .sheet{transform:none;opacity:1}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.sh-head h2{margin:0;font-size:17px;line-height:1.25}
.x{border:1px solid var(--line);background:var(--soft);border-radius:9px;width:34px;height:34px;font-size:14px;flex:0 0 auto}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{width:82%;max-width:340px;aspect-ratio:1/1;object-fit:cover;border-radius:14px;flex:0 0 auto;scroll-snap-align:center;background:var(--soft)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.meta span{background:var(--soft);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--muted);font-weight:600}
.desc{margin:8px 0 12px;font-size:13.5px;color:var(--muted);line-height:1.5}
.lbl{font-size:12.5px;color:var(--muted);margin:10px 0 6px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill-size{border:1px solid var(--line);background:var(--soft);padding:9px 13px;border-radius:10px;font-size:14px;font-weight:700;min-width:46px}
.pill-size.active{background:var(--ink);border-color:var(--ink);color:#fff}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.row2{display:grid;grid-template-columns:1fr 52px;gap:8px;margin-top:14px}
.row2 .heart2{border:1px solid var(--line);background:#fff;border-radius:13px;display:grid;place-items:center}
.row2 .heart2 svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:1.9}
.row2 .heart2.on svg{fill:var(--heart);stroke:var(--heart)}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.item .th{width:54px;height:54px;border-radius:9px;background:var(--soft);object-fit:cover;flex:0 0 auto}
.item .tx{flex:1;min-width:0}
.item .tt{font-size:13.5px;font-weight:700;line-height:1.25}
.item .ss{font-size:12px;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{border:0;background:var(--soft);width:30px;height:30px;font-size:16px}
.qty span{min-width:26px;text-align:center;font-weight:700;font-size:13px}
.total{display:flex;justify-content:space-between;font-weight:800;margin:6px 2px 12px}
.ok-ico{width:60px;height:60px;border-radius:50%;background:#dcfce7;color:var(--ok);display:grid;place-items:center;font-size:30px;margin:10px auto}
.center{text-align:center}
.order-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.mini{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:600}
.mini.danger{color:#b42318}
.mini.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat div{background:var(--soft);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--muted)}
.stat b{display:block;color:var(--text);font-size:16px}
.err{color:#b42318;font-size:12.5px}
textarea.code{font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:#111318;color:#fff;padding:10px 14px;border-radius:11px;font-size:13.5px;font-weight:600;display:none;max-width:92vw;text-align:center}
.toast.show{display:block}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <div class="brand-title" id="shopTitle">STYLE HUB</div>
    <div class="brand-sub">Обувь и кроссовки · Бишкек</div>
  </div>
  <div class="top-actions">
    <a id="topWa" class="pill wa hidden" href="#" target="_blank" rel="noopener">WhatsApp</a>
    <button class="pill" data-act="orders">Запросы</button>
    <button id="adminBtn" class="pill hidden" data-act="admin">Админ</button>
  </div>
</header>

<!-- КАТАЛОГ -->
<section id="viewCatalog">
  <div class="hero" id="hero">
    <h1>Найдём вашу пару в Бишкеке</h1>
    <p>Выберите модель и размер — мы уточним наличие и цену у поставщиков и напишем вам в Telegram или WhatsApp.</p>
    <button class="linkbtn" style="color:#fff;padding:8px 0 0" data-act="info">Как мы работаем</button>
  </div>
  <div id="topStrip" class="hidden">
    <div class="strip-head"><h2>Топ недели</h2><button class="linkbtn" data-act="tab" data-tab="top">Смотреть все</button></div>
    <div class="strip" id="stripList"></div>
  </div>
  <div class="search-wrap">
    <div class="search">
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Nike, белые, зал, 42…" aria-label="Поиск по каталогу" />
      <button class="clear hidden" id="qClear" data-act="clearq" aria-label="Очистить">✕</button>
    </div>
    <div class="hist hidden" id="hist"></div>
  </div>
  <div class="chips" id="cats"></div>
  <div class="filters">
    <select id="brandSel" aria-label="Бренд"></select>
    <div class="seg" id="priceSeg">
      <button data-act="price" data-v="all" class="active">Все</button>
      <button data-act="price" data-v="priced">С ценой</button>
      <button data-act="price" data-v="request">По запросу</button>
    </div>
    <select id="sortSel" aria-label="Сортировка">
      <option value="new">Новые</option>
      <option value="top">Сначала топ</option>
      <option value="price_asc">Дешевле</option>
      <option value="price_desc">Дороже</option>
    </select>
  </div>
  <div class="countline"><span id="count"></span><button class="linkbtn hidden" id="reset" data-act="reset">Сбросить фильтры</button></div>
  <main class="grid" id="grid"></main>
  <div id="sentinel"></div>
</section>

<!-- ТОП НЕДЕЛИ -->
<section id="viewTop" class="hidden">
  <div class="strip-head"><h2>Топ недели</h2></div>
  <div class="countline"><span>Самые востребованные модели этой недели</span></div>
  <main class="grid" id="gridTop"></main>
</section>

<!-- ИЗБРАННОЕ -->
<section id="viewFav" class="hidden">
  <div class="strip-head"><h2>Избранное</h2></div>
  <main class="grid" id="gridFav"></main>
</section>

<nav class="nav" aria-label="Разделы">
  <button data-act="tab" data-tab="catalog" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Каталог</button>
  <button data-act="tab" data-tab="top"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Топ недели</button>
  <button data-act="tab" data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.2-9.2C1.6 7.3 3.8 4 7 4c2 0 3.4 1 5 3 1.6-2 3-3 5-3 3.2 0 5.4 3.3 4.2 6.8C19.5 15.4 12 20 12 20z"/></svg>Избранное<span class="cnt" id="favCnt">0</span></button>
  <button data-act="cart"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 016 0"/></svg>Запрос<span class="cnt" id="cartCnt">0</span></button>
</nav>

<div id="sheets"></div>
<div id="toast" class="toast" role="status"></div>

<script>
"use strict";
/* ========= helpers ========= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const INIT = tg ? (tg.initData || "") : "";
try { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#ffffff"); tg.setBackgroundColor && tg.setBackgroundColor("#ffffff"); } } catch (e) {}

const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = v => String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const fmt = n => Number(n || 0).toLocaleString("ru-RU");
const uid = () => (crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const haptic = (t = "light") => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const ask = msg => new Promise(res => {
  try { if (tg && tg.showConfirm) return tg.showConfirm(msg, ok => res(!!ok)); } catch (e) {}
  res(window.confirm(msg));
});
function blurActive() { const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) a.blur(); }

function waLink(phone, text) {
  const d = String(phone || "").replace(/\D/g, "");
  let n = d;
  if (d.length === 10 && d.startsWith("0")) n = "996" + d.slice(1);
  else if (d.length === 9) n = "996" + d;
  if (n.length < 11) return "";
  return "https://wa.me/" + n + (text ? "?text=" + encodeURIComponent(text) : "");
}

let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

const STATUS = {
  new: "🔎 Новый запрос", searching: "🕵️ Ищем вариант", quoted: "💬 Цена отправлена", confirmed: "✅ Подтверждён",
  paid: "💰 Оплачен", shipped: "🚚 Отправлен", done: "🎉 Доставлен", cancel: "❌ Отменён"
};

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (INIT) headers["X-Init-Data"] = INIT;
  let body = opts.body;
  if (body && !(body instanceof FormData) && typeof body !== "string") { body = JSON.stringify(body); }
  if (body) headers["Content-Type"] = "application/json";
  let res;
  try { res = await fetch(path, Object.assign({}, opts, { headers, body })); }
  catch (e) { throw new Error("Нет соединения. Проверьте интернет и повторите."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401) S.authExpired = true;
    let msg = data.detail || ("Ошибка " + res.status);
    if (Array.isArray(msg)) msg = "Проверьте введённые данные";
    throw new Error(msg);
  }
  return data;
}
const qs = o => Object.entries(o).filter(([, v]) => v !== "" && v != null && v !== false).map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v)).join("&");

/* ========= state ========= */
const PAGE = 24;
const S = {
  cfg: {}, cats: [], brands: [], top: [], total: 0, isAdmin: false, authed: false,
  tab: "catalog", q: "", cat: "all", brand: "", price: "all", sort: "new",
  list: { items: [], total: 0, loading: false, done: false, seq: 0, error: "" },
  fav: new Set((ls.get("sh_fav", []) || []).map(Number)),
  cart: ls.get("sh_cart", []) || [],
  cache: new Map(), submitting: false, reqId: null
};
const cacheAdd = arr => arr.forEach(p => S.cache.set(p.id, p));
const saveFav = () => ls.set("sh_fav", [...S.fav]);
const saveCart = () => ls.set("sh_cart", S.cart);

/* ========= icons ========= */
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.2-9.2C1.6 7.3 3.8 4 7 4c2 0 3.4 1 5 3 1.6-2 3-3 5-3 3.2 0 5.4 3.3 4.2 6.8C19.5 15.4 12 20 12 20z"/></svg>';

/* ========= cards ========= */
function priceHtml(p) {
  if (p.on_request) return '<div class="price req">Цена по запросу</div><div class="hint">Уточним за вас</div>';
  return '<div class="price">' + fmt(p.price) + " сом" + (p.old_price > p.price ? "<s>" + fmt(p.old_price) + "</s>" : "") + "</div>";
}
function card(p) {
  const fav = S.fav.has(p.id);
  const sizes = (p.sizes || []).length ? "Размеры: " + p.sizes.slice(0, 5).join(", ") + (p.sizes.length > 5 ? "…" : "") : "";
  const quick = p.sizes && p.sizes.length === 1;
  return '<article class="card">' +
    '<div class="img-box" data-act="open" data-id="' + p.id + '">' +
      (p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.title) + '" loading="lazy" decoding="async" onerror="this.remove()">' : "") +
      (p.is_top ? '<span class="badge hot">Топ</span>' : (p.badge ? '<span class="badge">' + esc(p.badge) + "</span>" : "")) +
      '<button class="heart ' + (fav ? "on" : "") + '" data-act="fav" data-id="' + p.id + '" aria-label="В избранное">' + HEART + "</button>" +
    "</div>" +
    '<div class="card-body">' +
      (p.brand_name ? '<div class="brand-tag">' + esc(p.brand_name) + "</div>" : "") +
      '<div class="card-title" data-act="open" data-id="' + p.id + '">' + esc(p.title) + "</div>" +
      priceHtml(p) +
      (sizes ? '<div class="sizes-mini">' + esc(sizes) + "</div>" : "") +
      '<button class="btn-primary" data-act="' + (quick ? "quick" : "open") + '" data-id="' + p.id + '">' + (p.on_request ? "Уточнить цену" : "В заявку") + "</button>" +
    "</div></article>";
}
const skeletons = n => Array.from({ length: n }, () => '<div class="sk"></div>').join("");

/* ========= catalog ========= */
function renderCats() {
  const all = [{ slug: "all", name: "Все" }].concat(S.cats);
  $("#cats").innerHTML = all.map(c => '<button class="chip ' + (S.cat === c.slug ? "active" : "") + '" data-act="cat" data-v="' + esc(c.slug) + '">' + esc(c.name) + "</button>").join("");
}
function renderBrands() {
  const sel = $("#brandSel");
  sel.innerHTML = '<option value="">Все бренды</option>' + S.brands.map(b => '<option value="' + esc(b.name) + '">' + esc(b.name) + " (" + b.count + ")</option>").join("");
  sel.value = S.brand;
}
function renderHist() {
  const h = ls.get("sh_hist", []) || [];
  const box = $("#hist");
  if (!h.length || S.q) { box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  box.innerHTML = h.slice(0, 8).map(x => '<button data-act="hist" data-v="' + esc(x) + '">' + esc(x) + "</button>").join("");
}
function pushHist(q) {
  q = q.trim(); if (q.length < 2) return;
  const h = (ls.get("sh_hist", []) || []).filter(x => x.toLowerCase() !== q.toLowerCase());
  h.unshift(q); ls.set("sh_hist", h.slice(0, 8));
}
function filtersActive() { return S.q || S.cat !== "all" || S.brand || S.price !== "all" || S.sort !== "new"; }

async function loadList(reset) {
  const L = S.list;
  if (reset) { L.items = []; L.total = 0; L.done = false; L.error = ""; L.seq++; L.loading = false; }
  if (L.loading || L.done) return;
  const seq = L.seq; L.loading = true; renderGrid();
  try {
    const r = await api("/api/products?" + qs({ q: S.q, cat: S.cat, brand: S.brand, price: S.price, sort: S.sort, offset: L.items.length, limit: PAGE }));
    if (seq !== L.seq) return;
    cacheAdd(r.items); L.items = L.items.concat(r.items); L.total = r.total; L.done = L.items.length >= r.total || !r.items.length; L.error = "";
  } catch (e) {
    if (seq !== L.seq) return;
    L.error = e.message; L.done = true;
  } finally {
    if (seq === L.seq) { L.loading = false; renderGrid(); }
  }
}
function renderGrid() {
  const L = S.list, grid = $("#grid");
  $("#reset").classList.toggle("hidden", !filtersActive());
  $("#qClear").classList.toggle("hidden", !S.q);
  if (L.loading && !L.items.length) {
    grid.innerHTML = skeletons(6) + '<div class="wake hidden" id="wake">Магазин просыпается, это займёт несколько секунд…</div>';
    $("#count").textContent = "Загружаем…";
    clearTimeout(renderGrid.t); renderGrid.t = setTimeout(() => { const w = $("#wake"); if (w) w.classList.remove("hidden"); }, 4000);
    return;
  }
  if (L.error && !L.items.length) {
    grid.innerHTML = '<div class="empty"><b>Не удалось загрузить каталог</b>' + esc(L.error) + '<br><button class="btn-secondary" data-act="retry">Повторить</button></div>';
    $("#count").textContent = ""; return;
  }
  $("#count").textContent = L.total ? "Найдено: " + L.total : "";
  if (!L.items.length) {
    grid.innerHTML = '<div class="empty"><b>Ничего не нашли</b>Оставьте запрос — подберём пару вручную и уточним цену.<br>' +
      '<button class="btn-primary" style="width:auto;padding:11px 18px" data-act="free">Подобрать пару</button></div>';
    return;
  }
  grid.innerHTML = L.items.map(card).join("") + (L.loading ? skeletons(2) : "");
}

/* search input */
let searchTimer;
$("#q").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { S.q = e.target.value.trim(); renderHist(); loadList(true); }, 280);
  $("#qClear").classList.toggle("hidden", !e.target.value);
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); clearTimeout(searchTimer); S.q = e.target.value.trim(); pushHist(S.q); renderHist(); loadList(true); e.target.blur(); }
});
$("#q").addEventListener("blur", () => { if (S.q) pushHist(S.q); });
$("#brandSel").addEventListener("change", e => { S.brand = e.target.value; loadList(true); });
$("#sortSel").addEventListener("change", e => { S.sort = e.target.value; loadList(true); });

new IntersectionObserver(es => { if (es[0].isIntersecting && S.tab === "catalog") loadList(false); }, { rootMargin: "500px" }).observe($("#sentinel"));

/* ========= top / favourites views ========= */
async function loadTop() {
  const g = $("#gridTop"); g.innerHTML = skeletons(4);
  try {
    const r = await api("/api/products?" + qs({ top: 1, sort: "top", limit: 60 }));
    cacheAdd(r.items);
    g.innerHTML = r.items.length ? r.items.map(card).join("") :
      '<div class="empty"><b>Подборка обновляется</b>Скоро здесь появятся самые востребованные пары недели.<br><button class="btn-secondary" data-act="tab" data-tab="catalog">Открыть каталог</button></div>';
  } catch (e) { g.innerHTML = '<div class="empty"><b>Не удалось загрузить</b>' + esc(e.message) + "</div>"; }
}
async function loadFav() {
  const g = $("#gridFav"), ids = [...S.fav];
  if (!ids.length) {
    g.innerHTML = '<div class="empty"><b>Здесь пока пусто</b>Нажмите на сердечко у понравившейся пары — она сохранится здесь.<br><button class="btn-secondary" data-act="tab" data-tab="catalog">Открыть каталог</button></div>';
    return;
  }
  g.innerHTML = skeletons(Math.min(ids.length, 4));
  try {
    const r = await api("/api/products?" + qs({ ids: ids.slice(0, 100).join(","), limit: 100 }));
    cacheAdd(r.items);
    const order = new Map(ids.map((id, i) => [id, i]));
    const items = r.items.slice().sort((a, b) => order.get(b.id) - order.get(a.id));
    // убираем из избранного то, чего больше нет в каталоге
    const alive = new Set(r.items.map(p => p.id));
    let changed = false; ids.forEach(id => { if (!alive.has(id)) { S.fav.delete(id); changed = true; } });
    if (changed) { saveFav(); updateBadges(); }
    g.innerHTML = items.length ? items.map(card).join("") : '<div class="empty"><b>Здесь пока пусто</b>Эти модели уже убрали из каталога.</div>';
  } catch (e) { g.innerHTML = '<div class="empty"><b>Не удалось загрузить</b>' + esc(e.message) + "</div>"; }
}
function switchTab(t) {
  S.tab = t;
  ["catalog", "top", "fav"].forEach(n => $("#view" + n[0].toUpperCase() + n.slice(1)).classList.toggle("hidden", n !== t));
  $$(".nav button[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
  window.scrollTo({ top: 0 });
  if (t === "top") loadTop(); else if (t === "fav") loadFav();
}

/* ========= favourites ========= */
function toggleFav(id) {
  const on = !S.fav.has(id);
  on ? S.fav.add(id) : S.fav.delete(id);
  saveFav(); haptic();
  $$('[data-act="fav"][data-id="' + id + '"], [data-act="fav2"][data-id="' + id + '"]').forEach(b => b.classList.toggle("on", on));
  updateBadges();
  if (S.authed) api("/api/favorites/" + id, { method: "POST", body: { on } }).catch(() => {});
  if (S.tab === "fav" && !on) loadFav();
}
async function syncFav() {
  if (!S.authed) return;
  try {
    const r = await api("/api/favorites/sync", { method: "POST", body: { ids: [...S.fav] } });
    S.fav = new Set(r.ids.map(Number)); saveFav(); updateBadges();
    $$('[data-act="fav"]').forEach(b => b.classList.toggle("on", S.fav.has(Number(b.dataset.id))));
  } catch (e) {}
}

/* ========= cart ========= */
function updateBadges() {
  const c = S.cart.reduce((a, x) => a + x.qty, 0);
  $("#cartCnt").textContent = c; $("#cartCnt").classList.toggle("show", c > 0);
  $("#favCnt").textContent = S.fav.size; $("#favCnt").classList.toggle("show", S.fav.size > 0);
}
function addToCart(p, size) {
  const f = S.cart.find(x => x.id === p.id && x.size === size);
  if (f) f.qty = Math.min(10, f.qty + 1);
  else S.cart.push({ id: p.id, title: p.title, size, qty: 1, price: p.price || 0, image: p.image || "" });
  saveCart(); updateBadges(); haptic("medium");
  toast("Добавлено в запрос: " + p.title + ", р. " + size);
}

/* ========= sheets ========= */
const sheets = [];
function syncBack() {
  document.body.classList.toggle("lock", sheets.length > 0);
  try { if (tg && tg.BackButton) sheets.length ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}
try { if (tg && tg.BackButton) tg.BackButton.onClick(() => { const s = sheets[sheets.length - 1]; if (s) closeSheet(s); }); } catch (e) {}
function openSheet(inner) {
  blurActive(); $("#toast").classList.remove("show");
  const bd = document.createElement("div");
  bd.className = "backdrop";
  bd.innerHTML = '<div class="sheet"><div class="grab"></div>' + inner + "</div>";
  bd.addEventListener("pointerdown", e => { if (e.target === bd) closeSheet(bd); });
  $("#sheets").appendChild(bd); sheets.push(bd);
  requestAnimationFrame(() => bd.classList.add("open"));
  syncBack(); return bd;
}
function closeSheet(bd) {
  const i = sheets.indexOf(bd); if (i < 0) return;
  sheets.splice(i, 1); bd.classList.remove("open"); blurActive();
  setTimeout(() => bd.remove(), 220); syncBack();
}
const head = t => '<div class="sh-head"><h2>' + esc(t) + '</h2><button class="x" data-act="close" aria-label="Закрыть">✕</button></div>';

/* ----- product sheet ----- */
function openProduct(id) {
  const p = S.cache.get(id); if (!p) return;
  const imgs = p.images && p.images.length ? p.images : (p.image ? [p.image] : []);
  const sizes = p.sizes && p.sizes.length ? p.sizes : ["39", "40", "41", "42", "43", "44"];
  const link = waLink(S.cfg.whatsapp, "Здравствуйте! Интересует " + p.title + ". Подскажите наличие и цену.");
  openSheet(
    head(p.title) +
    (imgs.length ? '<div class="gallery">' + imgs.map(u => '<img src="' + esc(u) + '" alt="" loading="lazy" onerror="this.remove()">').join("") + "</div>" : "") +
    '<div class="meta">' + (p.brand ? "<span>" + esc(p.brand) + "</span>" : "") + (p.color ? "<span>" + esc(p.color) + "</span>" : "") + (p.sku ? "<span>арт. " + esc(p.sku) + "</span>" : "") + "</div>" +
    priceHtml(p) +
    '<p class="desc">' + esc(p.description || "Подберём пару под ваш размер. Наличие и цену уточним у поставщиков.") + "</p>" +
    '<div class="lbl">Выберите размер</div>' +
    '<div class="pills" id="pSizes">' + sizes.map(s => '<button class="pill-size ' + (sizes.length === 1 ? "active" : "") + '" data-act="size" data-v="' + esc(s) + '">' + esc(s) + "</button>").join("") + "</div>" +
    '<div class="row2"><button class="btn-primary big" data-act="addsheet" data-id="' + p.id + '">' + (p.on_request ? "Уточнить наличие и цену" : "Добавить в заявку") + "</button>" +
    '<button class="heart2 ' + (S.fav.has(p.id) ? "on" : "") + '" data-act="fav2" data-id="' + p.id + '" aria-label="В избранное">' + HEART + "</button></div>" +
    (link ? '<div style="margin-top:10px"><a class="btn-wa" href="' + link + '" target="_blank" rel="noopener">Спросить в WhatsApp</a></div>' : "")
  );
}

/* ----- cart sheet ----- */
function cartTotals() {
  const known = S.cart.reduce((a, x) => a + (x.price > 0 ? x.price * x.qty : 0), 0);
  const unknown = S.cart.some(x => !(x.price > 0));
  return { known, unknown };
}
function cartBody() {
  const items = S.cart.map((x, i) =>
    '<div class="item">' + (x.image ? '<img class="th" src="' + esc(x.image) + '" alt="" onerror="this.remove()">' : '<div class="th"></div>') +
    '<div class="tx"><div class="tt">' + esc(x.title) + '</div><div class="ss">Размер ' + esc(x.size) + " · " + (x.price > 0 ? fmt(x.price) + " сом" : "цена по запросу") + "</div></div>" +
    '<div class="qty"><button data-act="qty" data-i="' + i + '" data-d="-1" aria-label="Меньше">−</button><span>' + x.qty + '</span><button data-act="qty" data-i="' + i + '" data-d="1" aria-label="Больше">+</button></div></div>'
  ).join("");
  const t = cartTotals();
  return (S.cart.length ? items +
      '<div class="total"><span>' + (t.unknown ? (t.known ? "Известные цены" : "Стоимость") : "Итого") + "</span><span>" +
      (t.known ? fmt(t.known) + " сом" : "") + (t.unknown ? (t.known ? " + " : "") + "уточним для вас" : "") + "</span></div>"
    : '<div class="box">Моделей пока нет. Добавьте пару из каталога или опишите её в комментарии — мы подберём сами.</div>') +
    '<div class="field"><label for="oPhone">Телефон или WhatsApp *</label><input id="oPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0555 123 456" value="' + esc(ls.get("sh_phone", "")) + '"></div>' +
    '<div class="field"><label for="oCity">Город или район *</label><input id="oCity" type="text" autocomplete="address-level2" placeholder="Бишкек, Аламедин-1" value="' + esc(ls.get("sh_city", "")) + '"></div>' +
    '<div class="field"><label for="oNote">' + (S.cart.length ? "Пожелания" : "Какую пару ищете? *") + '</label><textarea id="oNote" rows="2" placeholder="Цвет, размер, бюджет, ссылка на фото"></textarea></div>' +
    '<button class="btn-primary big" id="sendBtn" data-act="send">' + (S.cart.length ? "Отправить запрос" : "Подобрать пару") + "</button>" +
    '<div class="err" id="oErr" style="margin-top:8px"></div>';
}
let cartSheet = null;
function openCart(prefillNote) {
  if (cartSheet && sheets.includes(cartSheet)) { renderCart(); return; }
  cartSheet = openSheet(head("Ваш запрос") + '<div id="cartBody"></div>');
  renderCart();
  if (prefillNote) $("#oNote", cartSheet).value = prefillNote;
}
function renderCart() {
  if (!cartSheet) return;
  const keep = { p: $("#oPhone", cartSheet), c: $("#oCity", cartSheet), n: $("#oNote", cartSheet) };
  const vals = { p: keep.p && keep.p.value, c: keep.c && keep.c.value, n: keep.n && keep.n.value };
  $("#cartBody", cartSheet).innerHTML = cartBody();
  if (vals.p != null) $("#oPhone", cartSheet).value = vals.p;
  if (vals.c != null) $("#oCity", cartSheet).value = vals.c;
  if (vals.n != null) $("#oNote", cartSheet).value = vals.n;
}
async function sendOrder() {
  if (S.submitting) return;
  const phone = $("#oPhone", cartSheet).value.trim(), city = $("#oCity", cartSheet).value.trim(), note = $("#oNote", cartSheet).value.trim();
  const err = $("#oErr", cartSheet), btn = $("#sendBtn", cartSheet);
  err.textContent = "";
  if (phone.replace(/\D/g, "").length < 9) { err.textContent = "Укажите номер телефона полностью"; return; }
  if (city.length < 2) { err.textContent = "Укажите город или район"; return; }
  if (!S.cart.length && note.length < 5) { err.textContent = "Опишите пару, которую ищете, или добавьте модель из каталога"; return; }
  S.submitting = true; btn.disabled = true; const label = btn.textContent; btn.textContent = "Отправляем…";
  if (!S.reqId) S.reqId = uid();
  try {
    const r = await api("/api/orders", { method: "POST", body: { phone, address: city, comment: note, req_id: S.reqId, items: S.cart.map(x => ({ id: x.id, size: x.size, qty: x.qty })) } });
    ls.set("sh_phone", phone); ls.set("sh_city", city);
    S.cart = []; saveCart(); updateBadges(); S.reqId = null;
    const link = waLink(S.cfg.whatsapp, "Здравствуйте! Это по запросу #" + r.id + " в " + (S.cfg.shop_name || "STYLE HUB") + ".");
    $("#cartBody", cartSheet).innerHTML =
      '<div class="center"><div class="ok-ico">✓</div><h3 style="margin:6px 0">Запрос #' + r.id + ' отправлен</h3>' +
      '<p class="desc">Уточним наличие и цену и напишем вам. Статус можно смотреть в «Мои запросы».</p></div>' +
      (link ? '<a class="btn-wa" href="' + link + '" target="_blank" rel="noopener">Написать в WhatsApp</a><div style="height:8px"></div>' : "") +
      '<button class="btn-secondary" style="width:100%" data-act="close">Вернуться в каталог</button>';
  } catch (e) {
    err.textContent = e.message;
    if (S.authExpired) err.textContent += " Закройте приложение и откройте его из чата с ботом.";
    btn.disabled = false; btn.textContent = label;
  } finally { S.submitting = false; }
}

const field = (l, inner) => '<div class="field"><label>' + l + "</label>" + inner + "</div>";

function openAdmin() {

async function admTab(t, arg) {
  A.tab = t;
  $$('[id^="atab-"]').forEach(b => b.classList.toggle("active", b.id === "atab-" + t));
  const box = A.box; if (!box || !document.body.contains(box)) return;
  try {
    if (t === "products") await admProducts(true);
    else if (t === "edit") admEdit(arg || null);
    else if (t === "import") admImport();
    else if (t === "orders") await admOrders();
    else if (t === "cats") admCats();
    else if (t === "settings") admSettings();
  } catch (e) { box.innerHTML = '<div class="box">' + esc(e.message) + "</div>"; }
}

function compress(file, max = 1000, q = 0.82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("Не удалось прочитать файл"));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error("Не удалось открыть фото"));
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* --- import --- */
const HDR = {
  sku: "sku", "артикул": "sku", title: "title", "название": "title", "модель": "title", name: "title", brand: "brand", "бренд": "brand",
  category: "category", "категория": "category", price: "price", "цена": "price", old_price: "old_price", "старая цена": "old_price",
  sizes: "sizes", "размеры": "sizes", color: "color", "цвет": "color", image: "image", "фото": "image", images: "images",
  description: "description", "описание": "description", tags: "tags", "теги": "tags", top: "top", "топ": "top", active: "active", "активен": "active"
};
const SAMPLE = "sku,title,brand,category,price,old_price,sizes,color,image,description,tags,top\n" +
  'NK-AM90-WH,Nike Air Max 90,Nike · США,Кроссовки,,,"39-45",Белый,https://example.com/photos/nk-am90-wh.jpg,"Классика с воздушной вставкой Air",лето город,1\n' +
  'MZ-WM-BL,Mizuno Wave Momentum,Mizuno · Япония,Спорт и зал,6900,,"40,41,42,43,44",Синий,https://example.com/photos/mz-wm-bl.jpg,"Для волейбола и зала",волейбол зал,0';
function parseCSV(text, delim) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; if (row.some(x => x.trim() !== "")) rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur); if (row.some(x => x.trim() !== "")) rows.push(row);
  return rows;
}
function normRow(o) { const r = {}; Object.keys(o).forEach(k => { const key = HDR[String(k).trim().toLowerCase()] || null; if (key) r[key] = Array.isArray(o[k]) ? o[k].join("|") : o[k]; }); return r; }
function parseImport(text) {
  text = text.replace(/^\uFEFF/, "").trim(); if (!text) return [];
  if (text[0] === "[" || text[0] === "{") {
    let j = JSON.parse(text); if (!Array.isArray(j)) j = j.items || j.rows || j.products || [];
    return j.map(normRow);
  }
  const first = text.split(/\r?\n/, 1)[0];
  const delim = [";", "\t", "|", ","].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = parseCSV(text, delim);
  const head = rows[0].map(h => HDR[h.trim().toLowerCase()] || "");
  if (head.includes("title")) return rows.slice(1).map(r => { const o = {}; head.forEach((k, i) => { if (k) o[k] = (r[i] || "").trim(); }); return o; });
  return rows.map(r => ({ title: (r[0] || "").trim(), brand: (r[1] || "").trim(), category: (r[2] || "").trim(), image: (r[3] || "").trim(), sizes: (r[4] || "").trim() }));
}

function impCheck() {
  const info = $("#impInfo", A.box), go = $("#impGo", A.box);
  try {
    A.imp.rows = parseImport($("#impText", A.box).value);
  } catch (e) { info.classList.remove("hidden"); info.innerHTML = '<span class="err">Не удалось разобрать данные: ' + esc(e.message) + "</span>"; go.classList.add("hidden"); return; }
  const rows = A.imp.rows;
  info.classList.remove("hidden");
  if (!rows.length) { info.textContent = "Данных нет."; go.classList.add("hidden"); return; }
  const noTitle = rows.filter(r => !r.title).length;
  info.innerHTML = "Распознано позиций: <b>" + rows.length + "</b>" + (noTitle ? ' · <span class="err">без названия: ' + noTitle + " (будут пропущены)</span>" : "") +
    "<br>Например: " + rows.slice(0, 3).map(r => esc(r.title || "—")).join("; ");
  go.textContent = "Импортировать " + rows.length + " позиций"; go.classList.remove("hidden");
}
async function impRun() {
  const rows = A.imp.rows; if (!rows.length) return;
  const go = $("#impGo", A.box), bar = $("#impBar", A.box), info = $("#impInfo", A.box);
  go.disabled = true; bar.classList.remove("hidden");
  const BATCH = 200; let added = 0, updated = 0, skipped = 0; const errors = [];
  try {
    for (let i = 0; i < rows.length; i += BATCH) {
      const r = await api("/api/admin/import", { method: "POST", body: { rows: rows.slice(i, i + BATCH), offset: i, mode: "upsert" } });
      added += r.added; updated += r.updated; skipped += r.skipped; errors.push(...r.errors);
      $("i", bar).style.width = Math.round(Math.min(rows.length, i + BATCH) / rows.length * 100) + "%";
      info.textContent = "Загружено " + Math.min(rows.length, i + BATCH) + " из " + rows.length + "…";
    }
    info.innerHTML = "Готово. Добавлено: <b>" + added + "</b>, обновлено: <b>" + updated + "</b>, пропущено: <b>" + skipped + "</b>" +
      (errors.length ? '<br><span class="err">' + errors.slice(0, 10).map(e => "строка " + e.row + ": " + esc(e.error)).join("<br>") + "</span>" : "");
    go.classList.add("hidden"); await loadInitData(true); loadList(true);
  } catch (e) {
    info.innerHTML = '<span class="err">Остановились: ' + esc(e.message) + "</span><br>Уже загружено: добавлено " + added + ", обновлено " + updated + ". Повторный запуск безопасен — дублей не будет.";
    go.disabled = false;
  }
}

  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = Number(el.dataset.id), v = el.dataset.v;
  const sheetOf = el.closest(".backdrop");
  switch (act) {
    case "tab": switchTab(el.dataset.tab); break;
    case "cart": openCart(); break;
    case "orders": openOrders(); break;
    case "info": openInfo(); break;
    case "admin": openAdmin(); break;
    case "close": if (sheetOf) closeSheet(sheetOf); break;
    case "open": openProduct(id); break;
    case "fav": e.stopPropagation(); toggleFav(id); break;
    case "fav2": toggleFav(id); break;
    case "quick": { const p = S.cache.get(id); if (p) addToCart(p, p.sizes[0]); break; }
    case "size": $$(".pill-size", sheetOf).forEach(b => b.classList.toggle("active", b === el)); break;
    case "addsheet": {
      const p = S.cache.get(id), a = $(".pill-size.active", sheetOf);
      if (!a) { const box = $("#pSizes", sheetOf); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); toast("Выберите размер"); break; }
      addToCart(p, a.dataset.v); closeSheet(sheetOf); break;
    }
    case "qty": { const i = Number(el.dataset.i), it = S.cart[i]; if (!it) break; it.qty += Number(el.dataset.d); if (it.qty < 1) S.cart.splice(i, 1); else it.qty = Math.min(10, it.qty); saveCart(); updateBadges(); renderCart(); break; }
    case "send": sendOrder(); break;
    case "free": openCart(S.q ? "Ищу: " + S.q : ""); break;
    case "retry": loadList(true); break;
    case "cat": S.cat = v; renderCats(); loadList(true); break;
    case "price": S.price = v; $$("#priceSeg button").forEach(b => b.classList.toggle("active", b.dataset.v === v)); loadList(true); break;
    case "reset": S.q = ""; S.cat = "all"; S.brand = ""; S.price = "all"; S.sort = "new"; $("#q").value = ""; $("#sortSel").value = "new"; $("#brandSel").value = "";
      $$("#priceSeg button").forEach(b => b.classList.toggle("active", b.dataset.v === "all")); renderCats(); renderHist(); loadList(true); break;
    case "clearq": S.q = ""; $("#q").value = ""; renderHist(); loadList(true); break;
    case "hist": $("#q").value = v; S.q = v; renderHist(); loadList(true); break;
    /* admin */
    case "atab": admTab(v); break;
    case "astate": A.state = v; admProducts(true); break;
    case "amore": admLoadMore(false).catch(er => toast(er.message)); break;
    case "atop": { const p = S.cache.get(id); try { await admFlag(id, { is_top: !p.is_top }); } catch (er) { toast(er.message); } break; }
    case "ahide": { const p = S.cache.get(id); try { await admFlag(id, { active: !p.active }); } catch (er) { toast(er.message); } break; }
    case "aedit": admTab("edit", S.cache.get(id)); break;
    case "adel": if (await ask("Удалить модель «" + (S.cache.get(id) || {}).title + "»?")) { try { await api("/api/admin/products/" + id, { method: "DELETE" }); toast("Модель удалена"); S.fav.delete(id); saveFav(); updateBadges(); loadInitData(true); loadList(true); admProducts(true); } catch (er) { toast(er.message); } } break;
    case "asave": admSave(el.dataset.id); break;
    case "purge": if (await ask("Удалить все позиции без артикула? Это остатки старого демо-каталога. Действие нельзя отменить.")) { try { const r = await api("/api/admin/products/purge_legacy", { method: "POST", body: { confirm: true } }); toast("Удалено: " + r.deleted); loadInitData(true); loadList(true); admProducts(true); } catch (er) { toast(er.message); } } break;
    case "impsample": $("#impText", A.box).value = SAMPLE; impCheck(); break;
    case "impcheck": impCheck(); break;
    case "impgo": impRun(); break;
    case "acatadd": { const n = $("#newCat", A.box).value.trim(); if (!n) return toast("Введите название категории"); try { S.cats = await api("/api/admin/categories", { method: "POST", body: { name: n } }); renderCats(); admCats(); toast("Категория добавлена"); } catch (er) { toast(er.message); } break; }
    case "acatsave": { const inp = $('[data-cat="' + CSS.escape(v) + '"]', A.box); try { S.cats = await api("/api/admin/categories", { method: "POST", body: { slug: v, name: inp.value.trim() } }); renderCats(); toast("Сохранено"); } catch (er) { toast(er.message); } break; }
    case "acatdel": if (await ask("Удалить категорию? Товары останутся, но без категории.")) { try { S.cats = await api("/api/admin/categories/" + encodeURIComponent(v), { method: "DELETE" }); if (S.cat === v) S.cat = "all"; renderCats(); admCats(); loadList(true); } catch (er) { toast(er.message); } } break;
    case "asettings": {
      try {
        S.cfg = await api("/api/admin/settings", { method: "POST", body: { shop_name: $("#sName", A.box).value.trim() || "STYLE HUB", whatsapp: $("#sWa", A.box).value.trim(), delivery_text: $("#sDel", A.box).value.trim(), pay_text: $("#sPay", A.box).value.trim() } });
        applyCfg(); toast("Настройки сохранены");
      } catch (er) { toast(er.message); }
      break;
    }
  }
});
document.addEventListener("change", async e => {
  const el = e.target.closest('[data-act="ostatus"]'); if (!el) return;
  try { await api("/api/admin/orders/" + el.dataset.id + "/status", { method: "POST", body: { status: el.value } }); toast("Статус обновлён"); } catch (er) { toast(er.message); }
});
$("#shopTitle").addEventListener("click", openInfo);

/* ========= клавиатура: закрываем при тапе мимо поля и при прокрутке ========= */
document.addEventListener("pointerdown", e => {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !e.target.closest("input,textarea,select,label,.clear")) a.blur();
}, true);
let touchY = null;
document.addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchmove", e => {
  const a = document.activeElement;
  if (touchY != null && a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && Math.abs(e.touches[0].clientY - touchY) > 14) a.blur();
}, { passive: true });

boot();
</script>
</body>
</html>
